name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  # ── Open / update release PR, create tag + GitHub Release on merge ────────
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # ── Build and upload binaries to the GitHub Release ───────────────────────
  binaries:
    name: Binary (${{ matrix.target }})
    needs: release-please
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container != '' && matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: built inside nvidia/cuda devel container → one binary with
          # DNNL + CUDA dynamic-loading; auto-detects GPU at runtime.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zellig-linux-x86_64.tar.gz
            use_zigbuild: false
            container: "nvidia/cuda:12.6.3-devel-ubuntu22.04"
            features: cuda
            cuda_version: ""
          # macOS: CUDA not available on Apple hardware → CPU/DNNL only.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: zellig-macos-x86_64.tar.gz
            use_zigbuild: false
            container: ""
            features: local
            cuda_version: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zellig-macos-aarch64.tar.gz
            use_zigbuild: false
            container: ""
            features: local
            cuda_version: ""
          # Windows: CUDA toolkit installed at build time via Jimver action;
          # cuda-dynamic-loading so the binary runs on CPU-only machines too.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: zellig-windows-x86_64.zip
            use_zigbuild: false
            container: ""
            features: cuda
            cuda_version: "12.6.2"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Install Rust (inside container)
        if: matrix.container != ''
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Install build dependencies (Linux in container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential pkg-config python3-pip

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          rustup show
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Pin CMake to 3.x (Windows — CMake 4.x breaks FindCUDA used by ct2rs)
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.7'

      - name: Install CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust"]'

      - name: Junction CUDA to short path (FindCUDA chokes on backslash+letter in paths with spaces)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = if ($env:CUDA_PATH) { $env:CUDA_PATH } else { "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6" }
          cmd /c "mklink /J C:\CUDA `"$src`""
          Add-Content -Path $env:GITHUB_ENV -Value "CUDA_PATH=C:/CUDA"

      - name: Install cargo-zigbuild (Linux)
        if: matrix.use_zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (Linux with zigbuild)
        if: matrix.use_zigbuild
        run: |
          cargo zigbuild --release --locked \
            --target x86_64-unknown-linux-gnu.2.17 \
            --features ${{ matrix.features }}

      - name: Build (non-Linux)
        if: ${{ !matrix.use_zigbuild && runner.os != 'Windows' }}
        run: cargo build --release --locked --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf ${{ matrix.artifact }} \
            -C target/x86_64-unknown-linux-gnu/release zellig
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release zellig
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/zellig.exe -DestinationPath ${{ matrix.artifact }}
          $hash = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -FilePath "${{ matrix.artifact }}.sha256" -Encoding ASCII

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # ── Build and push Docker image to GHCR ──────────────────────────────────
  docker:
    name: Docker (GHCR)
    needs: release-please
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/kodaskills/zellig
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Publish to crates.io after a release is created ───────────────────────
  crates-io:
    name: Publish to crates.io
    needs: release-please
    if: |
      (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      !contains(needs.release-please.outputs.tag_name, '-')
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Install Rust + build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl cmake build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-crates"

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --features cuda
